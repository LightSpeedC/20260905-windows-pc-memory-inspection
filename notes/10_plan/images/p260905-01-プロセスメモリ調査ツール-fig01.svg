<text x="922" y="140" font-family="Yu Gothic UI, Meiryo, sans-serif" font-size="12" fill="#1c2330">SVG グラフ</text>
<text x="922" y="160" font-family="Yu Gothic UI, Meiryo, sans-serif" font-size="12" fill="#1c2330">表・プロセスツリー</text>
