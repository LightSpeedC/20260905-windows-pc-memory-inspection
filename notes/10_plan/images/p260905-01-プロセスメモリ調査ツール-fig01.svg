<text x="922" y="200" font-family="Yu Gothic UI, Meiryo, sans-serif" font-size="12" fill="#1c2330">JSON（次回の比較用）</text>

<text x="10" y="245" font-family="Yu Gothic UI, Meiryo, sans-serif" font-size="12" fill="#4a5568">1〜3 と、5 のうち HTML の出力は実装済み。4 と、5 の JSON・AI の考察の枠がこれからの拡張にあたる。</text>
