<text x="694" y="140" font-family="Yu Gothic UI, Meiryo, sans-serif" font-size="12" fill="#1c2330">逼迫度の判定</text>
<text x="694" y="160" font-family="Yu Gothic UI, Meiryo, sans-serif" font-size="12" fill="#1c2330">カテゴリ別の内訳</text>
