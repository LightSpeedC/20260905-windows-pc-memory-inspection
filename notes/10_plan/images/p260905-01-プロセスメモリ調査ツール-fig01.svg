<text x="10"  y="140" font-family="Yu Gothic UI, Meiryo, sans-serif" font-size="12" fill="#1c2330">Win32_Process</text>
<text x="10"  y="160" font-family="Yu Gothic UI, Meiryo, sans-serif" font-size="12" fill="#1c2330">Win32_Service</text>
